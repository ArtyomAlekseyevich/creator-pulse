name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Build attempt $attempt failed, retrying in 60s..."; sleep 60
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
