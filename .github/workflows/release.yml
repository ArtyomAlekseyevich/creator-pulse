name: Release

# Push a tag like v1.2.0 and this builds a signed release APK and publishes it as a GitHub Release.
# The app's updater reads the latest release, so this is how updates reach phones.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/creatorpulse-release.jks
            echo "signing: release key"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing, APK will be signed with the debug key"
          fi
      - name: Build release APK
        env:
          KEYSTORE_FILE: keystore/creatorpulse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Pcreatorpulse.updateRepo="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "CreatorPulse-${TAG#v}.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CreatorPulse-*.apk
          generate_release_notes: true
